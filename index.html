<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Shree Vasupujya Jewellers</title>

                    "on-error-container": "#93000a",
                    "on-primary-container": "#86a0cd",
                    "on-tertiary-container": "#959fb3",
                    "error": "#ba1a1a",
                    "tertiary-fixed": "#d9e3f9",
                    "on-secondary-container": "#745c00",
                    "surface": "#f7f9fb",
                    "surface-container-highest": "#e0e3e5",

                    "on-background": "#191c1e",
                    "surface-bright": "#f7f9fb",
                    "surface-container-lowest": "#ffffff",
                    "surface-dim": "#d8dadc",
                    "error-container": "#ffdad6",
                    "surface-variant": "#e0e3e5",
                    "primary": "#002045",
                    "outline": "#74777f",
                    "tertiary-container": "#2c3647",
                    "on-secondary": "#ffffff",
                    "on-primary-fixed-variant": "#2d476f",
                    "background": "#f7f9fb",
                    "secondary-fixed-dim": "#e9c349",
                    "outline-variant": "#c4c6cf",
                    "on-tertiary": "#ffffff",
                    "secondary-container": "#fed65b",

                    "tertiary": "#172131",

                    "on-primary": "#ffffff",
                    "on-tertiary-fixed-variant": "#3d4759",
                    "surface-container-low": "#f2f4f6",
                    "on-secondary-fixed": "#241a00",
                    "inverse-on-surface": "#eff1f3",
                    "secondary-fixed": "#ffe088",
                    "secondary": "#735c00",
                    "on-secondary-fixed-variant": "#574500",
                    "on-primary-fixed": "#001b3c",
                    "surface-container": "#eceef0",
                    "surface-container-high": "#e6e8ea",
                    "primary-fixed": "#d6e3ff",
                    "on-error": "#ffffff",
                    "inverse-primary": "#adc7f7",
                    "primary-fixed-dim": "#adc7f7",
                    "on-surface": "#191c1e"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",

            "spacing": {
                    "gutter": "16px",
                    "xs": "4px",
                    "touch-target": "48px",

            },
            "fontFamily": {

            "fontSize": {

                    "headline-lg": ["30px", {"lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],

                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "value-display": ["22px", {"lineHeight": "28px", "fontWeight": "700"}]

          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-overlay {
            background-color: rgba(0, 32, 69, 0.75); /* Primary Navy with opacity */
        }
        .form-container {
            backdrop-filter: blur(8px);
            background-color: rgba(255, 255, 255, 0.95);
        }
        .gold-border {
            border-left: 6px solid #D4AF37;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center font-body-md">
<!-- Background Layer -->
<div class="fixed inset-0 z-0">
<img alt="Gold and silver bars stacked securely" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD1HHoJDz7izS-kOfhxhT_qaSrf1fI21MKFEJ4RWTfM5nio9pRH5zsxhLHDdCSIdKN9yy8-c0yD4Th9HSNdzkU07bz-J807sq5Iqc0pwVcNf3b5yT29bST2FOtT-QzqJWMRPicNT4aqFNIU0jw2nr28aT6AiB-Gnug7F2b8vlPg2_9ehchA8u2V8DcCdfohD-ybrMWr7Wmh_kzgxR7-hDZsuvrFDvg-WZK-S88R-AARHqhfAGu-xPDFdSyIQmItruq2GdKYE3RL1w"/>
<div class="absolute inset-0 bg-overlay"></div>
</div>
<!-- Login Content Shell -->
<main class="relative z-10 w-full max-w-[480px] px-margin-mobile">
<div class="flex flex-col gap-lg">
<!-- Branding Header -->
<header class="text-center">
<div class="flex flex-col items-center gap-sm">
<div class="w-16 h-16 bg-secondary-container rounded-xl flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-on-secondary-container !text-4xl" style="font-variation-settings: 'FILL' 1;">assured_workload</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-primary tracking-tight">
                        Shree Vasupujya Jewellers
                    </h1>
<p class="text-on-primary/70 font-label-caps text-label-caps uppercase tracking-widest">Premium Inventory Access</p>
</div>
</header>
<!-- Login Form Card -->
<section class="form-container rounded-xl p-md shadow-2xl gold-border">
<form class="flex flex-col gap-md" onsubmit="return false;">
<!-- Username Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant flex justify-between" for="username">
<span>USERNAME / PHONE</span>
<span class="text-primary/50">मोबाइल नंबर</span>
</label>
<div class="relative">
<span class="absolute left-sm top-1/2 -translate-y-1/2 material-symbols-outlined text-outline">person</span>
<input class="w-full h-touch-target pl-lg pr-base border-2 border-outline-variant rounded-lg focus:border-primary focus:ring-0 text-on-surface bg-surface-container-low transition-all" id="username" placeholder="Enter credentials" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant flex justify-between" for="password">
<span>PASSWORD</span>
<span class="text-primary/50">पासवर्ड</span>
</label>
<div class="relative">
<span class="absolute left-sm top-1/2 -translate-y-1/2 material-symbols-outlined text-outline">lock</span>
<input class="w-full h-touch-target pl-lg pr-lg border-2 border-outline-variant rounded-lg focus:border-primary focus:ring-0 text-on-surface bg-surface-container-low transition-all" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-outline hover:text-primary active:scale-95 transition-all" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="visibility-icon">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end">
<a class="text-primary font-label-caps text-label-caps hover:underline decoration-2 underline-offset-4" href="#">
                            Forgot Password?
                        </a>
</div>
<!-- Login Button -->
<button class="w-full h-touch-target bg-primary text-on-primary rounded-xl font-headline-md text-headline-md flex items-center justify-center gap-sm shadow-md active:scale-[0.98] transition-transform" type="submit">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">login</span>
                        LOGIN
                    </button>
</form>
</section>
<!-- Sync & Security Footer -->
<footer class="flex flex-col items-center gap-base">
<div class="flex items-center gap-xs px-base py-xs bg-surface-container-highest/20 rounded-full border border-on-primary/10 backdrop-blur-sm">
<span class="material-symbols-outlined text-on-primary !text-[18px]">verified_user</span>
<span class="font-label-caps text-label-caps text-on-primary/90">Securely encrypted session</span>
</div>
<div class="flex items-center gap-xs opacity-60">
<span class="material-symbols-outlined text-on-primary !text-[16px]">cloud_done</span>
<span class="font-label-caps text-label-caps text-on-primary text-[10px] uppercase tracking-tighter">System Synced: Rural North Region</span>
</div>
</footer>
</div>
</main>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibility-icon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                visibilityIcon.innerText = 'visibility';
            }
        }

        // Interaction Feedback
        const loginBtn = document.querySelector('button[type="submit"]');
        loginBtn.addEventListener('click', () => {
            loginBtn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>AUTHENTICATING...</span>
            `;
            setTimeout(() => {
                loginBtn.innerHTML = `
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">login</span>
                    LOGIN
                `;
                window.location.href = "dashboard.html";
            }, 1500);
        });
    </script>
</body></html>
